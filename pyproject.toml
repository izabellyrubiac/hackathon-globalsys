[project]
name = "inovaapps-churn"
version = "0.1.0"
description = "INOVAAPPS 2026 — análise e score de risco de cancelamento"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "openpyxl",
    "plotly",
    "jupyterlab",
    "ipywidgets",
    "nbformat",
    "nbconvert",
    "ipykernel",
    "scikit-learn",
    "lightgbm>=4.7.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "api/tests"]
markers = ["lento: teste demorado (base larga de escala); fora do padrão — rode com `uv run pytest -m lento`"]
addopts = "-m 'not lento'"
