<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Oráculo</title>
<link rel="icon" type="image/jpeg" href="public/globalsys_logo.jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#1f2430;--mut:#6b7280;--pri:#2563eb;--acc:#60a5fa;--bg:#f5f5f5;--card:#fff;--soft:#f0f1f3;--line:#e8eaee;--edge:#dcdfe5;--in:#fff;--drw:#fff;--hi:#c62828;--md:#b45309;--lo:#4f6d8a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Instrument Sans",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:30px;font-weight:500;line-height:1.15}h2{font-size:19px;font-weight:600}h3{font-size:15px;font-weight:600;margin:14px 0 6px}
p{margin:0}a{color:var(--pri)}.mut{color:var(--mut)}small{font-size:12px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* moldura fixa */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;background:var(--card);border-right:1px solid var(--edge);display:flex;flex-direction:column;gap:4px}
.logo{font-size:20px;font-weight:700;letter-spacing:-.02em;padding:4px 14px 18px}.logo span{color:var(--pri)}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{display:block;padding:9px 14px;border-radius:4px;font-size:14px;text-decoration:none;color:var(--ink)}
.side nav a:hover{background:var(--soft)}.side nav a[aria-current="page"]{background:var(--pri);color:#fff}
.modelo{margin-top:auto;padding:12px 14px;border-radius:4px;background:var(--soft);font-size:13px}
.modelo b{display:block;margin-bottom:2px}.modelo:empty{display:none}
.main{padding:28px 32px 48px;min-width:0;width:100%}.main.estreito{max-width:1180px;margin:0 auto}
.head{margin-bottom:20px}.head p{margin-top:6px;max-width:680px}

/* componentes */
.card{background:var(--card);border:1px solid var(--edge);border-radius:4px;padding:22px;margin-bottom:18px}
.card>h2{display:flex;align-items:center;gap:10px}.card>h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px}
.card>.sub{margin:4px 0 14px;font-size:14px}
.btn{border:0;border-radius:4px;padding:10px 20px;font:600 14px "Instrument Sans",Inter,sans-serif;cursor:pointer;background:var(--pri);color:#fff}
.btn:hover{filter:brightness(1.12)}.btn.ghost{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:5px 12px;font-size:13px}
input,select{width:100%;padding:9px 12px;border:1px solid var(--edge);border-radius:4px;background:var(--in);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}input[type=range]{padding:0}input[type=checkbox],input[type=range]{accent-color:var(--pri)}
.drop{margin-top:14px;border:2px dashed var(--acc);border-radius:4px;padding:30px;text-align:center;background:#f7f9fe;cursor:pointer}
.drop:focus-visible{outline-offset:4px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tabs .chip{padding:4px 12px}
.chip{display:inline-block;font-size:12px;background:var(--soft);color:var(--ink);border-radius:4px;padding:2px 10px;margin:1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}
.form label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.form>div{display:flex;flex-direction:column}.form>div>:last-child{margin-top:auto}
.form .par{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 16px;font:600 13px inherit;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--pri);color:#fff}
.vgrp{margin-top:14px}.vgrp h3{margin:0 0 6px;font-size:13px;color:var(--mut)}
.var{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:4px}.var:nth-child(even){background:var(--soft)}
.var label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.var input[type=range]{width:180px}.var .pv{width:34px;text-align:right;font-variant-numeric:tabular-nums}
.ring{width:56px;height:56px;border:5px solid var(--soft);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.ring{animation-duration:4s}}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.aviso{padding:10px 14px;border-radius:4px;background:var(--soft);font-size:13px;margin-bottom:16px}
.ok{border-color:var(--pri)}

/* ranking */
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mut);padding:8px;white-space:nowrap}td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}tr.r:hover,tr.r:focus-visible{background:var(--soft)}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
td small{white-space:nowrap}
.fila{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.fila>.card{margin-bottom:0}
.cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}.cab span{font-size:13px}
.sc{min-width:92px}.sc b{font-size:16px}.sc .sbar{height:5px;border-radius:4px;background:var(--soft);margin:3px 0 2px;overflow:hidden}.sc .sbar i{display:block;height:100%}
.sc.alto i{background:var(--hi)}.sc.atencao i{background:var(--md)}.sc.baixo i{background:var(--lo)}
.var-c{white-space:nowrap;font-variant-numeric:tabular-nums}.var-c small{display:block}
.var-c.pior{color:var(--hi)}.var-c.melhor{color:var(--lo)}.var-c.igual{color:var(--mut)}
.filtros{position:sticky;top:16px}.filtros h2{font-size:16px;margin-bottom:12px}
.filtros label,.filtros .lb{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
.fxs{display:flex;flex-wrap:wrap;gap:6px}.fxs button{border:1px solid var(--edge);background:var(--in);color:var(--ink);border-radius:4px;padding:4px 12px;font:600 13px "Instrument Sans",Inter,sans-serif;cursor:pointer}
.fxs button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.filtros .btn{width:100%;margin-top:18px}
.vazio{padding:28px 8px;text-align:center}
.mais{text-align:center;margin-top:14px}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--drw);border-left:1px solid var(--edge);padding:24px;overflow:auto;z-index:9;box-shadow:-8px 0 30px #0002}
.leg{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;margin:12px 0 4px}.leg i{display:inline-block;width:22px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}.leg i.cz{height:12px;border:0;background:var(--edge);opacity:.6;border-radius:2px;vertical-align:-2px}
.ag{margin-top:22px}.ag h3{margin:0 0 2px;font-size:16px}.ag h3 span{font-weight:400;font-size:13px}
.ag svg{display:block;width:100%;height:auto}.ag svg text{font:11px "Instrument Sans",Inter,sans-serif;fill:var(--mut)}
.ev{padding:10px 12px;border-radius:4px;background:var(--soft);margin:8px 0}
.spark{display:block;width:100%;height:auto;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:4px;z-index:20}

@media(max-width:1000px){.fila{grid-template-columns:1fr}.filtros{position:static;order:-1}}
@media(max-width:860px){
.app{grid-template-columns:1fr}
.side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--edge)}
.logo{padding:0 8px 0 4px;white-space:nowrap}.side nav{flex-direction:row}.side nav a{white-space:nowrap}
.modelo{display:none}.main{padding:18px 16px 40px}.var input[type=range]{width:110px}
}
</style></head><body>
<div class="app">
<aside class="side">
<div class="logo">Global <span>Oráculo</span></div>
<nav aria-label="Principal"><a href="#/ranking" id="n-ranking">Ranking</a><a href="#/modelos" id="n-modelos">Modelos</a></nav>
<div class="modelo" id="modelo"></div>
</aside>
<main class="main" id="mn"></main>
</div>
<div id="dw"></div>
<script>
const $=i=>document.getElementById(i),
  esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
  norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9%]+/g,' ').trim(),
  brl=n=>'R$ '+Math.round(n).toLocaleString('pt-BR'),
  pc=p=>Math.round(p*100)+'%',
  MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],
  toast=t=>{const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)};

/* ---------- estado ---------- */
const S={
  file:'',sheets:null,
  m:{tab:'',id:'',alvoTab:'',alvo:'',alvoTipo:'data',valTab:'',val:''},
  sel:{},w:{},modo:'auto',
  treino:null,   // {passo} enquanto treina
  treinado:null, // {quando, vars} depois de treinar
  rank:null,
  analise:null   // resultado do botão "Analisar dados"
};

/* ---------- ranking (mock do backend) ---------- */
/* O backend vai devolver a fila já ordenada pela perda anual esperada (probabilidade × valor × 12).
   Troque `api.ranking` por um fetch quando a API existir; a tela não reordena nada. */
/* chave da série em `modelo.series_historico` / `historico[].valores` (null: sem série numérica) */
const SERIE={uso:'uso_plataforma_pct',crit:'chamados_criticos',reab:'chamados_reabertos',sla:'pct_sla_cumprido',nps:'nota_nps',semresp:null,reun:'reunioes_realizadas',atraso:'dias_atraso_pagamento',recl:'reclamacoes_formais'};
const MOT={
  uso:['Uso da plataforma em queda','Propor treinamento e plano de adoção; investigar a queda de uso.'],
  crit:['Chamados críticos em alta','Escalar os chamados críticos ao time sênior e dar retorno em até 24h.'],
  reab:['Chamados reabertos','Fazer análise de causa raiz dos reabertos e confirmar a solução com o cliente.'],
  sla:['SLA cumprido abaixo do contratado','Alinhar um plano de recuperação do SLA e dar previsibilidade de prazo.'],
  nps:['NPS em queda','Ligar para entender a nota antes de qualquer desconto e registrar plano de ação.'],
  semresp:['Parou de responder à pesquisa','Contato ativo: silêncio na pesquisa é sinal de afastamento.'],
  reun:['Reuniões não realizadas','Reagendar reunião com o decisor e retomar a cadência.'],
  atraso:['Atraso de pagamento','Financeiro conversa com o cliente e investiga a insatisfação por trás do atraso.'],
  recl:['Reclamação formal','Gestor conversa com a diretoria do cliente sobre a reclamação.']
};
const CLIENTES=[
  ['C017','Logística','Médio','Avançado',18400,.46,'mar/2026',[['uso','Uso caiu de 78% para 41% em 4 meses',78,41],['crit','5 chamados críticos nos últimos 3 meses contra 1 nos 6 anteriores',1,5],['reun','Nenhuma reunião realizada desde abr/2026',3,0]],'2023-05',0.4],
  ['C052','Varejo','Grande','Avançado',31200,.31,'abr/2026',[['nps','Nota 9 em dez/2025 e 4 em jun/2026',9,4],['sla','SLA cumprido em 71% contra 92% nos 6 meses anteriores',92,71]],'2022-11',0.3],
  ['C008','Saúde','Pequeno','Básico',2900,.91,'jan/2026',[['semresp','Sem resposta à pesquisa há 4 meses'],['atraso','Atraso médio de 19 dias nos últimos 3 meses',3,19],['uso','Uso da plataforma em 22%',40,22]],'2024-02',0.8],
  ['C031','Indústria','Médio','Intermediário',9600,.68,'fev/2026',[['reab','7 chamados reabertos nos últimos 3 meses',1,7],['recl','2 reclamações formais em 2026',0,1.5],['sla','SLA cumprido em 64%',90,64]],'2023-08',0.7],
  ['C044','Serviços','Grande','Avançado',24800,.22,'mai/2026',[['reun','2 de 3 reuniões previstas não aconteceram',3,1],['uso','Uso caiu 12 p.p. em 3 meses',70,58]],'2024-09',0.18],
  ['C023','Varejo','Médio','Intermediário',7400,.57,'mar/2026',[['nps','Detrator desde abr/2026',8,5],['crit','3 chamados críticos em mai/2026',1,3]],'2023-01',0.5],
  ['C066','Logística','Pequeno','Básico',3100,.63,'fev/2026',[['atraso','Atraso de 12 dias em jun/2026',2,12],['semresp','Sem resposta à pesquisa há 3 meses']],'2025-03',0.6],
  ['C012','Saúde','Grande','Avançado',27500,.14,'mai/2026',[['sla','SLA cumprido em 83% em jun/2026',92,83]],'2022-06',0.16],
  ['C075','Indústria','Pequeno','Básico',2600,.34,'abr/2026',[['uso','Uso em 35% contra 58% antes',58,35]],'2024-06',0.34],
  ['C038','Serviços','Médio','Intermediário',8800,.19,'mai/2026',[['reab','2 chamados reabertos em jun/2026',1,2]],'2023-10',0.21],
  ['C059','Varejo','Pequeno','Básico',3300,.09,'jun/2026',[['nps','Nota 7 em jun/2026 contra 9 antes',9,7]],'2025-01',0.07],
  ['C004','Saúde','Médio','Intermediário',10100,.06,'jun/2026',[],'2021-12',0.06]
];
const MESES18=[...Array(18)].map((_,i)=>`${2025+(i>11)}-${String(i%12+1).padStart(2,'0')}`);
/* histórico mensal simulado (jan/2025 a jun/2026): estável e, nos últimos meses, caminha para o valor recente */
function historico(id,motivos,p,ant){
  let z=[...id].reduce((x,c)=>(x*31+c.charCodeAt(0))%65521,7);const r=()=>(z=z*16807%2147483647)/2147483647;
  const vals=Object.fromEntries(motivos.filter(([k,,b])=>SERIE[k]&&b!=null).map(([k,,b,a])=>[SERIE[k],MESES18.map((_,i)=>{
    const t=Math.min(1,Math.max(0,(i-13)/3)),ruido=(r()-.5)*.16*Math.max(Math.abs(a),Math.abs(b),1);
    return Math.max(0,+(b+(a-b)*t+ruido).toFixed(1))}) ]));
  return MESES18.map((m,i)=>({mes_ref:m,risco:i==17?p:i==16?ant:+(ant*(.55+.45*i/16)).toFixed(4),
    valores:Object.fromEntries(Object.entries(vals).map(([k,v])=>[k,v[i]]))}));
}
/* mesma regra do backend (motor/saida.py `_comparacao`): média dos últimos 3 meses × média dos 6 anteriores */
function comparacao(h,chave){
  const v=h.map(x=>x.valores[chave]).filter(x=>typeof x=='number'),rec=v.slice(-3),ant=v.slice(-9,-3),m=a=>a.reduce((s,x)=>s+x,0)/a.length;
  return rec.length&&ant.length?{chave,recente:+m(rec).toFixed(2),anterior:+m(ant).toFixed(2),meses_recente:rec.length,meses_anterior:ant.length}:null;
}
const api={ranking:()=>new Promise(ok=>setTimeout(()=>ok(CLIENTES.map(([id,seg,porte,plano,v,p,desde,mot,inicio,ant])=>{
  const h=historico(id,mot,p,ant);
  return{cliente_id:id,segmento:seg,porte,plano,valor_mensal:v,inicio_contrato:inicio,probabilidade:p,prob_mes_anterior:ant,score:Math.round(40+p*60),perda_anual_esperada:p*v*12,
  faixa:p>=.5?'alto':p>=.25?'atencao':'baixo',sinal_desde:desde,historico:h,
  motivos:mot.map(([k,evidencia])=>({titulo:MOT[k][0],evidencia,acao:MOT[k][1],chave_serie:SERIE[k],comparacao:SERIE[k]?comparacao(h,SERIE[k]):null}))}
}).sort((a,b)=>b.perda_anual_esperada-a.perda_anual_esperada).map((c,i)=>({posicao:i+1,...c}))),350))};
const mesFmt=m=>m?MES[+m.slice(5,7)-1]+'/'+m.slice(0,4):'—';

/* ---------- filtros do ranking (só filtram a exibição; a ordem e a posição vêm do backend) ---------- */
const F0={q:'',faixa:'',plano:'',porte:'',seg:'',vmin:'',desde:'',n:10};
let F={...F0};
const filtrar=()=>S.rank.filter(c=>(!F.faixa||c.faixa==F.faixa)&&(!F.q||norm(c.cliente_id).includes(norm(F.q)))&&(!F.plano||c.plano==F.plano)&&(!F.porte||c.porte==F.porte)&&(!F.seg||c.segmento==F.seg)&&(F.vmin===''||c.valor_mensal>=+F.vmin)&&(!F.desde||c.inicio_contrato>=F.desde));
const setF=(k,v)=>{F[k]=v;F.n=F0.n;pintarFila()};
const limparF=()=>{F={...F0};render()};
const maisF=()=>{F.n+=10;pintarFila()};
const sg=x=>(x>0?'+':x<0?'−':'')+Math.abs(x).toLocaleString('pt-BR',{maximumFractionDigits:1});
const nf=x=>x.toLocaleString('pt-BR',{maximumFractionDigits:1});
/* chance do mês anterior: campo do mock ou, na API, o penúltimo `historico[].risco` */
function varData(c){
  const ant=c.prob_mes_anterior??c.historico?.at(-2)?.risco??c.probabilidade,pp=(c.probabilidade-ant)*100,rel=ant?pp/(ant*100)*100:0;
  return{pp,rel,k:Math.abs(pp)<1?'igual':pp>0?'pior':'melhor'};
}
const varSeta=k=>k=='pior'?'▲':k=='melhor'?'▼':'●';
const variacao=c=>{const{pp,rel,k}=varData(c);return`<td class="var-c ${k}"><b>${varSeta(k)} ${sg(Math.round(rel))}%</b><small>${sg(pp)} p.p.</small></td>`};

/* gráfico de linha da variável ao longo do histórico; o fundo marca os 3 meses da comparação */
function spark(h,chave){
  const pts=h.map(x=>x.valores?.[chave]);if(pts.filter(v=>typeof v=='number').length<2)return'';
  const W=360,H=38,n=pts.length,ok=pts.filter(v=>typeof v=='number'),mn=Math.min(...ok),mx=Math.max(...ok),
    X=i=>(i/(n-1))*(W-6)+3,Y=v=>mx==mn?H/2:H-4-((v-mn)/(mx-mn))*(H-8),
    xs=pts.map((v,i)=>typeof v=='number'?[X(i),Y(v)]:null).filter(Boolean),ult=xs.at(-1);
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução mensal de ${esc(mesFmt(h[0].mes_ref))} a ${esc(mesFmt(h[n-1].mes_ref))}: de ${nf(ok[0])} a ${nf(ok.at(-1))}"><rect x="${X(n-3)-3}" y="0" width="${W-X(n-3)+3}" height="${H}" fill="var(--edge)" opacity=".45"/><polyline points="${xs.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--pri)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${ult[0].toFixed(1)}" cy="${ult[1].toFixed(1)}" r="3" fill="var(--pri)"/></svg>`;
}
const compTxt=m=>`${nf(m.recente)} ${m.meses_recente==1?'no último mês':'nos últimos '+m.meses_recente+' meses'} contra ${nf(m.anterior)} ${m.meses_anterior==1?'no mês anterior':'nos '+m.meses_anterior+' meses anteriores'}`;

/* ---------- leitura da base ---------- */
const colsOf=n=>Object.keys(S.sheets[n][0]||{});
function load(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(r.result,{type:'array',cellDates:true}),sh={};
    wb.SheetNames.forEach(n=>{const j=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''});if(j.length)sh[/\.csv$/i.test(f.name)?f.name.replace(/\.csv$/i,''):n]=j});
    if(!Object.keys(sh).length)throw 0;
    setData(sh,f.name);
  }catch(e){toast('Não foi possível ler o arquivo. Envie .xlsx, .xls ou .csv.')}};
  r.readAsArrayBuffer(f);
}
function setData(sh,name){S.sheets=sh;S.file=name;S.sel={};S.w={};S.treinado=null;S.treino=null;S.analise=null;sugerir();render()}

/* sugestão automática do mapeamento; o usuário confirma na tela */
function sugerir(){
  const ids=Object.keys(S.sheets),m=S.m={tab:'',id:'',alvoTab:'',alvo:'',alvoTipo:'data',valTab:'',val:''};
  const idRe=/(^| )(id|codigo|cod|cnpj)( |$)/,find=(s,re)=>colsOf(s).find(c=>re.test(norm(c)));
  const comId=ids.filter(s=>find(s,idRe));
  m.tab=comId.find(s=>/client|cadastro|contrato/.test(norm(s)))||[...comId].sort((a,b)=>S.sheets[a].length-S.sheets[b].length)[0]||'';
  if(m.tab)m.id=find(m.tab,idRe);
  const alvo=re=>{for(const s of comId){const c=find(s,re);if(c)return[s,c]}return null};
  const a=alvo(/(saida|cancelamento|churn)/);
  if(a)[m.alvoTab,m.alvo]=a;
  else{const b=alvo(/(situacao|status|cancelad)/);if(b){[m.alvoTab,m.alvo]=b;m.alvoTipo='situacao'}}
  const vRe=/valor|mensalidade|mrr/,vt=[m.tab,...comId].filter(Boolean).find(s=>find(s,vRe));
  if(vt){m.valTab=vt;m.val=find(vt,vRe)}
}

/* variáveis candidatas: colunas das tabelas ligadas ao cliente, menos identificador, tempo e tudo que revela o cancelamento */
const LEAK=/cancel|saida|situacao|status|churn/,TEMPO=/(^| )(mes|competencia|periodo)( |$)/;
function cand(){
  const m=S.m;if(!m.id)return[];
  const idn=norm(m.id),out=[];
  for(const s of Object.keys(S.sheets)){
    if(!colsOf(s).some(c=>norm(c)===idn))continue;
    for(const c of colsOf(s)){
      const n=norm(c);
      if(n===idn||LEAK.test(n)||TEMPO.test(n)||(s===m.alvoTab&&c===m.alvo))continue;
      out.push({k:s+'|'+c,s,c});
    }
  }
  return out;
}
const isSel=k=>S.sel[k]!==false,peso=k=>S.w[k]??.5;

/* ---------- análise dos dados (calculada no navegador; mesma leitura do notebook de sinais) ---------- */
/* Por métrica mensal: média móvel de 3 meses por cliente, alinhada em meses até a saída (cancelados: mês − mês da
   saída; ativos: último mês da base + 1, então −1 é o último mês com dados nos dois grupos), e mediana e faixa
   P25–P75 por grupo e mês. */
const MESES_AN=12,JANELA_AN=3;
const idxMes=i=>`${Math.floor(i/12)}-${String(i%12+1).padStart(2,'0')}`;
function mesIdx(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+432e5);return d.getUTCFullYear()*12+d.getUTCMonth()}
  const t=String(v??'').trim();let m=t.match(/^(\d{4})[-\/](\d{1,2})/);if(m)return+m[1]*12+ +m[2]-1;
  m=t.match(/^(\d{1,2})[-\/](\d{4})$/);return m?+m[2]*12+ +m[1]-1:null;
}
const quant=(s,p)=>{const i=(s.length-1)*p,a=Math.floor(i),b=Math.ceil(i);return s[a]+(s[b]-s[a])*(i-a)};
const resumo=v=>{if(!v.length)return null;const s=[...v].sort((a,b)=>a-b);return{med:quant(s,.5),p25:quant(s,.25),p75:quant(s,.75),n:s.length}};
/* AUC de cancelados × ativos (Mann-Whitney, empates pela média dos postos) */
function auc(pos,neg){
  if(!pos.length||!neg.length)return .5;
  const t=[...pos.map(v=>[v,1]),...neg.map(v=>[v,0])].sort((a,b)=>a[0]-b[0]);let soma=0;
  for(let i=0;i<t.length;){let j=i;while(j<t.length&&t[j][0]==t[i][0])j++;const r=(i+j+1)/2;for(let k=i;k<j;k++)if(t[k][1])soma+=r;i=j}
  return(soma-pos.length*(pos.length+1)/2)/(pos.length*neg.length);
}
/* maior k tal que, de −k até −1, a mediana de quem cancelou fica fora da faixa P25–P75 dos ativos */
function antecedencia(pontos){
  let k=0;
  for(let r=-1;r>=-MESES_AN;r--){const p=pontos[r+MESES_AN],c=p.c,a=p.a;if(!c||!a||!(c.med<a.p25||c.med>a.p75))break;k=-r}
  return k||null;
}
/* nome legível da coluna: sem prefixo/sufixo técnico (pct → %, h → horas) e com as palavras comuns acentuadas */
const PALAVRAS={criticos:'críticos',medio:'médio',resolucao:'resolução',reclamacoes:'reclamações',reunioes:'reuniões',nps:'NPS',sla:'SLA',
  atendimento:'atendimento',servico:'serviço',servicos:'serviços',numero:'número',ultimo:'último',media:'média',historico:'histórico'};
function rotuloSerie(c){
  let w=c.split('_').filter(Boolean),un='';
  if(w.includes('pct')){w=w.filter(x=>x!='pct');un=' (%)'}else if(w.length>1&&w.at(-1)=='h'){w.pop();un=' (h)'}
  const t=w.map(x=>PALAVRAS[x.toLowerCase()]||x).join(' ')+un;return t[0].toUpperCase()+t.slice(1);
}
/* Ordem = relevância. Aqui é a separação (|AUC − 0,5| da média dos 3 últimos meses), o mesmo critério da pré-seleção
   do motor; quando o front ler o pesos.json da API, trocar esta função pela ordem de importância do modelo. */
const ordemRelevancia=ser=>[...ser].sort((a,b)=>Math.abs(b.auc-.5)-Math.abs(a.auc-.5));

function analisar(){
  const m=S.m,idn=norm(m.id),erro=t=>{S.analise={erro:t};render()};
  if(m.alvoTipo!='data')return erro('Para comparar quem saiu com quem ficou é preciso a coluna com o mês da saída. Escolha-a em “O que prever”.');
  const idAlvo=colsOf(m.alvoTab).find(c=>norm(c)===idn);if(!idAlvo)return erro('A tabela do cancelamento não tem a coluna do identificador.');
  const saida=new Map();
  for(const r of S.sheets[m.alvoTab]){const id=String(r[idAlvo]).trim(),v=r[m.alvo];if(v===''||v==null)saida.set(id,null);else{const i=mesIdx(v);if(i!=null)saida.set(id,i)}}
  const cols=[];
  for(const s of Object.keys(S.sheets)){
    const idc=colsOf(s).find(c=>norm(c)===idn),mc=colsOf(s).find(c=>TEMPO.test(norm(c)));
    if(!idc||!mc)continue;
    for(const c of colsOf(s)){
      const n=norm(c);if(c===idc||c===mc||LEAK.test(n)||TEMPO.test(n)||(s===m.alvoTab&&c===m.alvo)||!isSel(s+'|'+c))continue;
      const vs=S.sheets[s].map(r=>r[c]).filter(v=>v!==''&&v!=null);
      if(vs.length&&vs.filter(v=>typeof v=='number'&&isFinite(v)).length/vs.length>=.8)cols.push({s,c,idc,mc});
    }
  }
  if(!cols.length)return erro('Nenhuma tabela mensal (com coluna de mês) e métricas numéricas para analisar.');
  let maxMes=-Infinity;
  for(const s of new Set(cols.map(x=>x.s))){const mc=cols.find(x=>x.s==s).mc,idc=cols.find(x=>x.s==s).idc;for(const r of S.sheets[s]){if(!saida.has(String(r[idc]).trim()))continue;const i=mesIdx(r[mc]);if(i!=null&&i>maxMes)maxMes=i}}
  const canc=[...saida.values()].filter(v=>v!=null).length,ativ=saida.size-canc;
  if(!canc||!ativ)return erro('É preciso ter clientes cancelados e ativos para comparar.');
  const ser=[];
  for(const {s,c,idc,mc} of cols){
    const por=new Map();
    for(const r of S.sheets[s]){
      const id=String(r[idc]).trim(),v=r[c];if(!saida.has(id)||typeof v!='number'||!isFinite(v))continue;
      const mi=mesIdx(r[mc]);if(mi==null)continue;
      let a=por.get(id);if(!a)por.set(id,a=new Map());const x=a.get(mi)||[0,0];x[0]+=v;x[1]++;a.set(mi,x);
    }
    const g={c:Array.from({length:MESES_AN},()=>[]),a:Array.from({length:MESES_AN},()=>[])},fim={c:[],a:[]};
    for(const [id,meses] of por){
      const grp=saida.get(id)!=null?'c':'a',ref=saida.get(id)??maxMes+1,ms=[...meses.keys()].sort((x,y)=>x-y),
        bruto=ms.map(k=>meses.get(k)[0]/meses.get(k)[1]),ult=[];
      ms.forEach((k,i)=>{
        const rel=k-ref;if(rel<-MESES_AN||rel>-1)return;
        const j=bruto.slice(Math.max(0,i-JANELA_AN+1),i+1);g[grp][rel+MESES_AN].push(j.reduce((a,b)=>a+b,0)/j.length);
        if(rel>=-JANELA_AN)ult.push(bruto[i]);
      });
      if(ult.length)fim[grp].push(ult.reduce((a,b)=>a+b,0)/ult.length);
    }
    const pontos=g.c.map((_,i)=>({rel:i-MESES_AN,c:resumo(g.c[i]),a:resumo(g.a[i])}));
    if(!pontos.some(p=>p.c)||!pontos.some(p=>p.a))continue;
    ser.push({k:s+'|'+c,rotulo:rotuloSerie(c),pontos,ant:antecedencia(pontos),auc:auc(fim.c,fim.a)});
  }
  if(!ser.length)return erro('As métricas não têm histórico suficiente nos 12 meses antes da saída.');
  S.analise={series:ordemRelevancia(ser),canc,ativ,ref:idxMes(maxMes)};render();
}

const nfg=x=>x.toLocaleString('pt-BR',{maximumFractionDigits:2});
function ticks(lo,hi,n=4){
  if(lo==hi){lo-=1;hi+=1}
  const raw=(hi-lo)/n,p=10**Math.floor(Math.log10(raw)),f=raw/p,st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p,t=[];
  for(let v=Math.floor(lo/st)*st;v<=Math.ceil(hi/st)*st+st/2;v+=st)t.push(+v.toFixed(10));return t;
}
/* um gráfico: mediana e faixa P25–P75 de cada grupo por mês até a saída; o fundo cinza marca os 3 meses finais */
function grafico(sr){
  const W=960,H=240,L=50,R=12,T=10,B=36,P=sr.pontos,tv=[];
  P.forEach(p=>['c','a'].forEach(g=>{if(p[g])tv.push(p[g].p25,p[g].p75,p[g].med)}));
  const tk=ticks(Math.min(...tv),Math.max(...tv)),lo=tk[0],hi=tk.at(-1),
    X=r=>L+(r+MESES_AN+.5)/MESES_AN*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B),f1=v=>v.toFixed(1);
  const cor={c:'var(--hi)',a:'var(--lo)'},nome={c:'Cancelou',a:'Ativo'};
  const runs=g=>{const o=[];let cur=[];P.forEach(p=>{if(p[g])cur.push(p);else if(cur.length){o.push(cur);cur=[]}});if(cur.length)o.push(cur);return o};
  let svg=`<rect x="${f1(X(-3.5))}" y="${T}" width="${f1(X(-.5)-X(-3.5))}" height="${H-T-B}" fill="var(--edge)" opacity=".6"/>`;
  svg+=tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="var(--line)"/><text x="${L-6}" y="${f1(Y(v)+4)}" text-anchor="end">${nfg(v)}</text>`).join('');
  for(const g of ['a','c']){
    for(const r of runs(g)){
      svg+=`<polygon points="${r.map(p=>f1(X(p.rel))+','+f1(Y(p[g].p75))).join(' ')} ${[...r].reverse().map(p=>f1(X(p.rel))+','+f1(Y(p[g].p25))).join(' ')}" fill="${cor[g]}" opacity=".15"/>`;
      svg+=`<polyline points="${r.map(p=>f1(X(p.rel))+','+f1(Y(p[g].med))).join(' ')}" fill="none" stroke="${cor[g]}" stroke-width="2" stroke-linejoin="round"/>`;
    }
    svg+=P.filter(p=>p[g]).map(p=>`<circle cx="${f1(X(p.rel))}" cy="${f1(Y(p[g].med))}" r="3" fill="${cor[g]}"><title>${nome[g]} · mês ${sg(p.rel)}: mediana ${nfg(p[g].med)} (P25–P75: ${nfg(p[g].p25)} a ${nfg(p[g].p75)}), ${p[g].n} clientes</title></circle>`).join('');
  }
  svg+=P.map(p=>`<text x="${f1(X(p.rel))}" y="${H-B+15}" text-anchor="middle">${sg(p.rel)}</text>`).join('');
  svg+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" style="font-size:12px">Meses até a saída (−1 = último mês com dados)</text>`;
  const u=P.at(-1),desc=`${sr.rotulo}, mediana no mês −1: ${u.c?nfg(u.c.med):'sem dado'} entre os que cancelaram e ${u.a?nfg(u.a.med):'sem dado'} entre os ativos`;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}">${svg}</svg>`;
}
function viewAnalise(a){
  if(!a)return'';
  if(a.erro)return`<p class="mut" style="margin-top:14px">${esc(a.erro)}</p>`;
  return`<p class="sub mut" style="margin:14px 0 0">Cada métrica nos ${MESES_AN} meses antes da saída, com média móvel de ${JANELA_AN} meses por cliente. Ativos alinhados a ${esc(mesFmt(a.ref))}. “Separa desde”: a mediana de quem cancelou já fica fora da faixa P25–P75 dos ativos até o fim. Da mais para a menos relevante.</p>
<div class="leg"><span><i style="border-color:var(--hi)"></i>Cancelou (mediana e faixa P25–P75) · ${a.canc} clientes</span><span><i style="border-color:var(--lo)"></i>Ativo (mediana e faixa P25–P75) · ${a.ativ} clientes</span><span><i class="cz"></i>3 meses finais</span></div>
${a.series.map((sr,i)=>`<div class="ag"><h3>${i+1}. ${esc(sr.rotulo)} <span class="mut">· ${sr.ant?'separa desde o mês '+sg(-sr.ant):'não separa'}</span></h3>${grafico(sr)}</div>`).join('')}`;
}

function viewTreinar(){
  const head=`<div class="head"><h1>Modelos</h1></div>`;
  const dados=`<div class="card ${S.sheets?'ok':''}"><h2><span class="n">1</span>Dados</h2><div class="drop" tabindex="0" role="button" onclick="$('fi').click()" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();$('fi').click()}" ondragover="event.preventDefault()" ondrop="event.preventDefault();load(event.dataTransfer.files[0])"><input id="fi" type="file" accept=".xlsx,.xls,.csv" hidden onchange="load(this.files[0])"><b>Clique ou arraste um csv/xlsx</b><p class="mut">${S.file?esc(S.file):'Nenhum arquivo selecionado'}</p></div>
<p style="margin-top:10px"><a href="#/modelos" onclick="setData(demo(),'dados_demonstracao.xlsx');return false">ou usar dados de demonstração</a></p>
${S.sheets?`<div class="tabs">${Object.entries(S.sheets).map(([n,r])=>`<span class="chip">${esc(n)} · ${r.length} linhas · ${colsOf(n).length} colunas</span>`).join('')}</div>`:''}</div>`;
  if(!S.sheets)return head+dados;
  const m=S.m;
  const mapa=`<div class="card"><h2><span class="n">2</span>O que prever</h2><p class="sub mut">Sugerimos automaticamente; confira e corrija se preciso.</p><div class="form">
${par('Tabela de clientes e coluna do identificador','tab','id',m.tab,m.id)}
${par('Coluna que será prevista (cancelamento)','alvoTab','alvo',m.alvoTab,m.alvo)}
<div><label>O que essa coluna guarda</label><select aria-label="Tipo da coluna prevista" onchange="setM('alvoTipo',this.value)"><option value="data" ${m.alvoTipo=='data'?'selected':''}>Data de saída (vazia se o cliente continua)</option><option value="situacao" ${m.alvoTipo=='situacao'?'selected':''}>Situação (ativo / cancelado)</option></select></div>
${par('Valor do contrato (opcional, define a prioridade)','valTab','val',m.valTab,m.val)}</div></div>`;
  const pronto=m.tab&&m.id&&m.alvoTab&&m.alvo;
  const analise=`<div class="card"><h2>Análise dos dados</h2><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="analisar()" ${pronto?'':'disabled title="Escolha a tabela de clientes, o identificador e a coluna de cancelamento."'}>Analisar dados</button>${S.analise?'<button class="btn ghost" onclick="S.analise=null;render()">Ocultar</button>':''}</div>${viewAnalise(S.analise)}</div>`;
  const c=cand(),grp={};c.forEach(x=>(grp[x.s]??=[]).push(x));
  const kq=x=>esc(JSON.stringify(x.k));
  const pesos=`<div class="card"><h2><span class="n">3</span>Variáveis e pesos</h2><p class="sub mut">Todas as outras colunas são candidatas. As colunas do cancelamento nunca entram, para o modelo não “colar” a resposta.</p>
<div class="seg" role="group" aria-label="Como definir os pesos"><button aria-pressed="${S.modo=='auto'}" onclick="S.modo='auto';render()">Automático (recomendado)</button><button aria-pressed="${S.modo=='manual'}" onclick="S.modo='manual';render()">Manual</button></div>
<p class="mut" style="margin:10px 0;font-size:13px">${S.modo=='auto'?'O motor escolhe sozinho quais variáveis pesam, comparando quem saiu com quem ficou. Desmarque apenas o que não deve ser usado.':'Dê um peso de 0 (ignorar) a 1 (máximo) para cada variável marcada.'}</p>
${c.length?`<div style="display:flex;gap:8px;margin-bottom:6px"><button class="btn ghost sm" onclick="marcar(true)">Marcar todas</button><button class="btn ghost sm" onclick="marcar(false)">Desmarcar todas</button></div>`:'<p class="mut">Escolha a coluna do identificador para listar as variáveis.</p>'}
${Object.entries(grp).map(([s,l])=>`<div class="vgrp"><h3>${esc(s)}</h3>${l.map(x=>`<div class="var"><label><input type="checkbox" ${isSel(x.k)?'checked':''} onchange="setSel(${kq(x)},this.checked)"> ${esc(x.c)}</label>${S.modo=='manual'&&isSel(x.k)?`<input type="range" min="0" max="1" step=".05" value="${peso(x.k)}" aria-label="Peso de ${esc(x.c)}" oninput="setPeso(this,${kq(x)})"><span class="pv">${peso(x.k).toFixed(2)}</span>`:''}</div>`).join('')}</div>`).join('')}</div>`;
  let fim;
  if(S.treino){const p=S.treino.passo;fim=`<div class="card" style="text-align:center" role="status"><h2 style="justify-content:center">Treinando o modelo</h2><div class="ring"></div><p class="mut">${PASSOS[Math.min(p,PASSOS.length-1)]}…</p><div class="bar" style="margin-top:12px"><i style="width:${p/PASSOS.length*100}%"></i></div></div>`}
  else fim=`<div class="card ${S.treinado?'ok':''}"><h2><span class="n">4</span>Treinar</h2>${S.treinado?`<p class="sub mut">Modelo treinado em ${S.treinado.quando} com ${S.treinado.vars} variáveis (simulado). A fila continua sendo a de demonstração.</p><a class="btn" href="#/ranking" style="display:inline-block;text-decoration:none">Ver a fila</a> `:'<p class="sub mut">Confirme o mapeamento e os pesos acima.</p>'}<button class="btn ${S.treinado?'ghost':''}" onclick="treinar()">${S.treinado?'Treinar de novo':'Treinar modelo'}</button></div>`;
  return head+dados+mapa+analise+pesos+fim;
}

function render(){
  const r=rota();
  document.querySelectorAll('.side nav a').forEach(a=>a.id=='n-'+r?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  $('modelo').innerHTML=S.treinado?`<b>Modelo treinado</b>${S.treinado.quando} · ${S.treinado.vars} variáveis`:'';
  $('mn').className='main'+(r=='modelos'?' estreito':'');
  $('mn').innerHTML=r=='modelos'?viewTreinar():viewRanking();
  if(r=='ranking'&&S.rank)pintarFila();
}
window.addEventListener('hashchange',()=>{fechar();render();window.scrollTo(0,0)});

/* ---------- dados de demonstração para o treino ---------- */
function demo(){
  let s=11;const r=()=>(s=s*16807%2147483647)/2147483647,mk=m=>`${2025+(m>11)}-${String(m%12+1).padStart(2,'0')}`,
    P=['Básico','Intermediário','Avançado'],T=['Pequeno','Médio','Grande'],G=['Varejo','Saúde','Indústria','Serviços'],cli=[],mes=[],sit=[];
  for(let i=0;i<50;i++){
    const id='C'+String(i+1).padStart(3,'0'),p=Math.floor(r()*3),v=Math.round((3+p*6+r()*6)*1000),out=i<11?9+Math.floor(r()*9):99;
    cli.push({cliente_id:id,segmento:G[Math.floor(r()*4)],porte:T[Math.min(2,Math.floor(v/7000))],plano:P[p],valor_mensal:v});
    sit.push({cliente_id:id,situacao:out<99?'Cancelado':'Ativo',mes_cancelamento:out<99?mk(out):''});
    for(let m=0;m<18&&m<out;m++){
      const d=out<99?Math.max(0,(m-out+8)/7):i<20?Math.max(0,(m-10)/7):0;
      mes.push({cliente_id:id,mes_ref:mk(m),chamados_abertos:Math.round(3+r()*3+d*7),chamados_criticos:Math.round(r()*1.5+d*3),pct_sla_cumprido:Math.round(96-d*32-r()*6),uso_plataforma_pct:Math.round(90-d*55-r()*8),dias_atraso_pagamento:Math.round(d*25*r())});
    }
  }
  return{clientes:cli,atendimento_mensal:mes,situacao_clientes:sit};
}

/* ---------- início ---------- */
render();
api.ranking().then(r=>{S.rank=r;if(rota()=='ranking')render()});
</script></body></html>
