const pr=a=>{const v=a.map((x,i)=>[x,i]).filter(p=>p[0]!=null).sort((p,q)=>p[0]-q[0]),o=a.map(()=>.5),n=v.length;for(let i=0;i<n;){let j=i;while(j<n&&v[j][0]==v[i][0])j++;for(let k=i;k<j;k++)o[v[k][1]]=n>1?(i+j-1)/2/(n-1):.5;i=j}return o};
const feat=(c,v,e)=>{const a=c.a[v];if(!a)return null;const w=(i,j)=>mean(a.slice(Math.max(0,i),j+1).filter(x=>x!=null));const k=S.cfg.rec,b=S.cfg.bas;let r=w(e-k+1,e);if(r==null)r=w(e-k-b+1,e);return r==null?null:[r,w(e-k-b+1,e-k)]};
function sv(v,E){const d=VD[v];if(d.t=='s')return pr(E.map(({c})=>{const x=c.s[v];if(x==null)return null;return v=='inicio'?mkey(x):v=='valor'?nn(x):cat[v]?.[x]??null}));
const f=E.map(({c,e})=>feat(c,v,e)),l=pr(f.map(x=>x&&d.d*x[0])),t=pr(f.map(x=>x&&d.d*(x[1]==null?0:x[0]-x[1])));return f.map((x,i)=>x?(l[i]+t[i])/2:.5)}
function platt(X,Y){let a=0,b=0;for(let it=0;it<25;it++){let g0=.01*a,g1=.01*b,h00=.01,h01=0,h11=.01;X.forEach((x,i)=>{const q=1/(1+Math.exp(-(a+b*x))),w=q*(1-q)+1e-6;g0+=q-Y[i];g1+=(q-Y[i])*x;h00+=w;h01+=w*x;h11+=w*x*x});const d=h00*h11-h01*h01||1e-9;a-=(h11*g0-h01*g1)/d;b-=(h00*g1-h01*g0)/d;a=Math.max(-30,Math.min(30,a));b=Math.max(0,Math.min(60,b))}return[a,b]}
const pc=p=>Math.round(p*100)+'%';
const dl=c=>{const d=(c.p-c.pp)*100,r=c.pp>.005?(c.p-c.pp)/c.pp*100:null,k=Math.abs(d)<.5?0:d>0?1:-1,col=k>0?'--hi':k<0?'--lo':'--mut';return`<span style="color:var(${col});font-weight:600">${k>0?'▲':k<0?'▼':'●'} ${r==null?'':(r>0?'+':'')+Math.round(r)+'%'}</span><br><small class="mut">${d>0?'+':''}${d.toFixed(1)} p.p.</small>`};
function analyze(){R={cl:[],learn:{},nch:0,vars:V.map(v=>v[0]).filter(k=>S.sel[k]&&S.map[k]!=null&&VD[k].sc)};cat={};
['plano','porte'].forEach(k=>{const g={};D.forEach(c=>{if(c.s[k]!=null)(g[c.s[k]]??=[]).push(val(c))});cat[k]={};for(const x in g)cat[k][x]=mean(g[x])});
const ac=D.filter(c=>!c.gone),e=M.length-1,E=ac.map(c=>({c,e}));R.cl=ac;ac.forEach((c,i)=>{c.i=i;c.sc={};c.f={};c.sp={}});
R.vars.forEach(v=>{const s=sv(v,E);ac.forEach((c,i)=>{c.sc[v]=s[i];if(VD[v].t=='t')c.f[v]=feat(c,v,e)})});
const E0=ac.map(c=>({c,e:e-1}));R.vars.forEach(v=>{const s=sv(v,E0);ac.forEach((c,i)=>c.sp[v]=s[i])});
const ch=D.filter(c=>c.gone&&c.xi>=3);R.nch=ch.length;
if(ch.length>=3){const E2=[...ch.map(c=>({c,e:Math.max(2,c.xi-2)})),...E];R.tr=E2.map((_,i)=>({y:i<ch.length?1:0,s:{}}));R.vars.forEach(v=>{const s=sv(v,E2),p=s.slice(0,ch.length),q=s.slice(ch.length);s.forEach((x,i)=>R.tr[i].s[v]=x);let a=0;p.forEach(x=>q.forEach(y=>a+=x>y?1:x==y?.5:0));R.learn[v]=a/(p.length*q.length)})}
if(S.mode=='auto')R.vars.forEach(v=>S.w[v]=R.nch>=3?(['valor','plano','porte'].includes(v)?.35:Math.max(.05,(R.learn[v]-.5)*2)):1);
else if(S.mode=='prioridade'){const n=S.order.length;S.order.forEach((v,i)=>S.w[v]=(n-i)/n)}}
function rank(L){const tw=L.reduce((a,v)=>a+(S.w[v]||0),0);cw={};L.forEach(v=>cw[v]=tw?S.w[v]||0:1);
const ws=(m,t)=>{let s=0;L.forEach(v=>s+=cw[v]*(m[v]??.5));return t?s/t:0},T=L.reduce((a,v)=>a+cw[v],0),cal=R.tr?platt(R.tr.map(o=>ws(o.s,T)),R.tr.map(o=>o.y)):null,P=x=>cal?1/(1+Math.exp(-(cal[0]+cal[1]*x))):Math.min(1,Math.max(0,x));R.cal=!!cal;
R.cl.forEach(c=>{c.score=ws(c.sc,T);c.p=P(c.score);c.pp=P(ws(c.sp,T))});
const hi=(cal?S.cfg.hi:S.cfg.hiS)/100,md=(cal?S.cfg.md:S.cfg.mdS)/100;R.cl.forEach(c=>{const x=cal?c.p:c.score;c.lv=x>=hi?'Alto':x>=md?'Médio':'Baixo'});return R.cl}
const why=(c,L)=>L.map(v=>({v,s:c.sc[v]??.5,x:cw[v]*(c.sc[v]??.5)})).filter(o=>o.s>=.6&&cw[o.v]>0).sort((a,b)=>b.x-a.x).slice(0,3);
const ev=(c,v)=>{const d=VD[v],f=c.f[v];if(d.t=='s')return d.l+': '+esc(v=='inicio'?fd(c.s[v]):v=='valor'?brl(val(c)):c.s[v]);return f?`${fx(f[0])} nos últimos 3 meses contra ${f[1]==null?'—':fx(f[1])} nos 6 meses anteriores`:''};
const spark=(c,v)=>{const a=c.a[v];if(!a)return'';const p=a.map((y,i)=>[i,y]).filter(q=>q[1]!=null);if(p.length<2)return'';const l=Math.min(...p.map(q=>q[1])),h=Math.max(...p.map(q=>q[1])),n=a.length-1;return`<svg viewBox="0 0 200 40" style="width:100%;height:40px"><polyline fill="none" stroke="var(--pri)" stroke-width="2" points="${p.map(q=>`${q[0]/n*200},${36-(h==l?.5:(q[1]-l)/(h-l))*32}`).join(' ')}"/></svg>`};

<div class="card"><h3 style="margin-top:0">Exibição</h3>${LB}Linhas por página</label><select onchange="S.cfg.pg=+this.value;S.pg=S.cfg.pg;saveC()">${[5,10,20,50].map(n=>`<option ${C.pg==n?'selected':''}>${n}</option>`).join('')}</select><button class="btn ghost" style="margin-top:14px;width:100%" onclick="resetC()">Restaurar faixas, janelas e exibição padrão</button></div></div></div>`}
function sT(k,v){S.cfg[k]=Math.max(0,Math.min(100,+v||0));saveC();pv()}
function pv(){if(!$('pv'))return;const C=S.cfg,a=rank(R.vars),n=k=>a.filter(c=>c.lv==k).length,h=C[R.cal?'hi':'hiS'],m=C[R.cal?'md':'mdS'];$('pv').innerHTML=`<div style="display:flex;height:14px;border-radius:9px;overflow:hidden"><i style="width:${m}%;background:var(--lo)"></i><i style="width:${Math.max(0,h-m)}%;background:var(--md)"></i><i style="flex:1;background:var(--hi)"></i></div><p style="margin:8px 0 0">Com estas faixas: <b>${n('Alto')}</b> Alto · <b>${n('Médio')}</b> Médio · <b>${n('Baixo')}</b> Baixo</p>${m>=h?'<p style="color:var(--hi)">O limite de Médio precisa ser menor que o de Alto.</p>':''}`}
function wSet(k){R.vars.forEach(v=>S.w[v]=k=='eq'||R.nch<3?1:(['valor','plano','porte'].includes(v)?.35:Math.max(.05,(R.learn[v]-.5)*2)));S.mode='peso';main()}
function applyWin(){S.cfg.rec=Math.max(1,Math.min(6,+$('cr').value||3));S.cfg.bas=Math.max(2,Math.min(12,+$('cb').value||6));saveC();analyze();toast('Análise recalculada.');main()}
function resetC(){S.cfg={...DEF};S.pg=DEF.pg;saveC();analyze();toast('Padrões restaurados.');main()}
function rt(){const L=lens();if(!L.length){$('tb').innerHTML='<p class="mut">Nenhuma variável desta visão foi selecionada na análise. Crie outra visão ou refaça a análise.</p>';return}
const all=rank(L),f=S.f,ex=c=>val(c)*c.p;
const x=all.filter(c=>(f.lv=='Todos'||c.lv==f.lv)&&(!f.q||norm(c.name).includes(norm(f.q)))&&(!f.plano||c.s.plano==f.plano)&&(!f.porte||c.s.porte==f.porte)&&(!f.seg||c.s.segmento==f.seg)&&(!f.min||val(c)>=+f.min)&&(!f.ini||mkey(c.s.inicio)>=mkey(f.ini))).sort((a,b)=>S.sort=='valor'?val(b)-val(a):S.sort=='exp'?ex(b)-ex(a):b.score-a.score);
const al=all.filter(c=>c.lv=='Alto');$('kp').innerHTML=[['Clientes ativos',all.length],['Risco alto',al.length],['Risco médio',all.filter(c=>c.lv=='Médio').length],['Receita mensal em risco alto',brl(al.reduce((s,c)=>s+val(c),0))],['Cancelados no histórico',D.filter(c=>c.gone).length]].map(([l,v])=>`<div class="card kpi"><b>${v}</b><span class="mut">${l}</span></div>`).join('');
$('tb').innerHTML=x.length?`<div class="tw"><table><tr><th>Score</th><th>Cliente</th><th>Valor mensal</th><th>Chance de cancelamento</th><th>Variação vs. mês anterior</th><th>Por quê</th></tr>${x.slice(0,S.pg).map(c=>`<tr class="r" onclick="drawer(${c.i})"><td style="min-width:90px"><b>${Math.round(c.score*100)}</b><div class="bar ${c.lv}"><i style="width:${c.score*100}%"></i></div><small class="mut">${c.lv}</small></td><td><b>${esc(c.name)}</b><br><small class="mut">${esc([c.s.plano,c.s.porte].filter(Boolean).join(' · '))}</small></td><td>${brl(val(c))}</td><td><b>${pc(c.p)}</b></td><td>${dl(c)}</td><td>${why(c,L).map(o=>`<span class="chip">${VD[o.v].l}</span>`).join('')}</td></tr>`).join('')}</table></div><p class="mut" style="font-size:12px">${R.cal?'Chance estimada com base no histórico: calibrada nos clientes que cancelaram, medidos 2 meses antes da saída. Nível: Alto com chance ≥ '+S.cfg.hi+'%, Médio ≥ '+S.cfg.md+'%, Baixo abaixo disso.':'Poucos cancelamentos no histórico: a chance é proporcional ao score, não uma probabilidade calibrada. Nível: Alto com score ≥ '+S.cfg.hiS+', Médio ≥ '+S.cfg.mdS+'.'} A variação compara com o mês anterior (▲ piorou, ▼ melhorou).</p>${x.length>S.pg?`<div style="text-align:center;margin-top:12px"><button class="btn" onclick="S.pg+=S.cfg.pg;rt()">Ver mais (${x.length-S.pg})</button></div>`:''}`:'<p class="mut">Nenhum cliente com esses filtros. Limpe os filtros para ver todos.</p>'}
function drawer(i){const c=R.cl[i],L=lens();rank(L);const w=why(c,L);$('dw').innerHTML=`<div class="drw"><button class="btn ghost" style="float:right" onclick="$('dw').innerHTML=''">Fechar</button><h2>${esc(c.name)}</h2><p><span class="bd ${c.lv}">${c.lv}</span> Score ${Math.round(c.score*100)} · Chance de cancelamento ${pc(c.p)} · ${brl(val(c))}/mês</p><p>Variação vs. mês anterior: ${dl(c)}</p><h3>Evidências</h3>${w.length?w.map(o=>`<div class="row" style="display:block"><b>${VD[o.v].l}</b><br><small>${ev(c,o.v)}</small>${spark(c,o.v)}</div>`).join(''):'<p class="mut">Nenhum sinal se destaca nesta visão.</p>'}<h3>O que fazer</h3><ol>${w.map(o=>`<li>${ACT[o.v]}</li>`).join('')||'<li>Manter o acompanhamento de rotina.</li>'}</ol></div>`}
render();
</script></body></html>
